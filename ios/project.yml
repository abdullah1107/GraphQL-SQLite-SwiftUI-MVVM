# Optional: regenerate GraphQLDemo.xcodeproj with XcodeGen (brew install xcodegen && xcodegen)
# Only needed if your Xcode is older than 16 and can't open the bundled project.
name: GraphQLDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GraphQLDemo:
    type: application
    platform: iOS
    sources:
      - path: GraphQLDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GraphQLDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GraphQLDemo-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: GraphQL Demo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
